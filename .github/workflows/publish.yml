name: Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: macos-latest
    timeout-minutes: 90
    if: github.repository == 'woods-marshes/prosemirror-compose'

    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-SNAPSHOT" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release secrets
        if: steps.version.outputs.release == 'true'
        run: |
          : "${ORG_GRADLE_PROJECT_mavenCentralUsername:?MAVEN_CENTRAL_USERNAME secret is required for releases}"
          : "${ORG_GRADLE_PROJECT_mavenCentralPassword:?MAVEN_CENTRAL_PASSWORD secret is required for releases}"
          : "${ORG_GRADLE_PROJECT_signingInMemoryKeyId:?SIGNING_KEY_ID secret is required for releases}"
          : "${ORG_GRADLE_PROJECT_signingInMemoryKey:?SIGNING_KEY secret is required for releases}"
          : "${ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:?SIGNING_PASSWORD secret is required for releases}"

      - name: Publish to Maven Central
        run: >-
          ./gradlew
          publishToMavenCentral
          -PVERSION_NAME=${{ steps.version.outputs.version }}
          --no-configuration-cache
          --stacktrace
