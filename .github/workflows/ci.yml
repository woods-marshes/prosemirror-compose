name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: JVM tests
        run: >-
          ./gradlew
          :prosemirror-compose:jvmTest
          :prosemirror-compose-coil3:jvmTest
          :composeApp:compileKotlinJvm
          --stacktrace

  ios-compile:
    name: Compile iOS targets
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile iOS targets
        run: >-
          ./gradlew
          :prosemirror-compose:compileKotlinIosArm64
          :prosemirror-compose:compileKotlinIosSimulatorArm64
          :prosemirror-compose-coil3:compileKotlinIosArm64
          :prosemirror-compose-coil3:compileKotlinIosSimulatorArm64
          --stacktrace
